version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: compileme-postgres
    environment:
      POSTGRES_DB: compileme
      POSTGRES_USER: compileme
      POSTGRES_PASSWORD: compileme
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compileme -d compileme"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: compileme-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@compileme.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
